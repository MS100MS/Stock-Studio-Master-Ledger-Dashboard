<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Ledger — Seven-Statement Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14171C;--bg-panel:#1A1E25;--paper:#EDEAE3;--muted:#8B90A0;--muted-2:#5D6273;--rule:#2A2F3A;--green:#4FAE83;--red:#C1503E;--amber:#D9A441;--focus:#7FB3D5;}
*{box-sizing:border-box;}html,body{margin:0;padding:0;}
body{background:radial-gradient(ellipse 900px 500px at 15% -10%,rgba(79,174,131,.06),transparent),radial-gradient(ellipse 900px 500px at 90% 0%,rgba(217,164,65,.05),transparent),var(--bg);color:var(--paper);font-family:'Inter',sans-serif;min-height:100vh;padding:28px 18px 70px;}
a{color:inherit;}::selection{background:var(--amber);color:#14171C;}
.wrap{max-width:1180px;margin:0 auto;}
.masthead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
.masthead-title{font-family:'Source Serif 4',serif;font-size:27px;font-weight:700;display:flex;align-items:baseline;gap:9px;}
.masthead-title .mark{color:var(--amber);font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;border:1px solid var(--amber);padding:2px 6px;border-radius:3px;}
.masthead-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.pdf-status{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted-2);min-height:14px;text-align:right;width:100%;}
.company-row{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
.company-row input{flex:1;min-width:200px;background:#101318;color:var(--paper);border:1px solid var(--rule);border-radius:6px;font-family:'Inter',sans-serif;font-size:14px;padding:9px 12px;}
select#savedSelect{background:#101318;color:var(--paper);border:1px solid var(--rule);border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:9px 10px;}
button.primary{background:var(--amber);color:#14171C;border:none;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;padding:9px 16px;border-radius:6px;cursor:pointer;}
button.primary:hover{box-shadow:0 0 0 3px rgba(217,164,65,0.2);}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--rule);font-family:'Inter',sans-serif;font-size:12.5px;padding:8px 13px;border-radius:6px;cursor:pointer;}
button.ghost:hover{color:var(--paper);border-color:var(--muted);}
button.ghost:disabled{opacity:0.4;cursor:not-allowed;}
button.ghost:disabled:hover{color:var(--muted);border-color:var(--rule);}
button.ghost.confirm{color:var(--red);border-color:var(--red);background:rgba(193,80,62,.06);}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:22px;border-bottom:1px solid var(--rule);}
.tabbtn{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:10px 14px;background:none;border:none;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;}
.tabbtn.active{color:var(--amber);border-bottom-color:var(--amber);}
.tabbtn .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:5px;}
.tabpanel{display:none;}.tabpanel.active{display:block;}
.intake{background:var(--bg-panel);border:1px solid var(--rule);border-radius:10px;padding:18px;margin-bottom:22px;}
textarea{width:100%;min-height:150px;resize:vertical;background:#101318;color:var(--paper);border:1px solid var(--rule);border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.5;padding:11px;}
.field-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:7px;display:block;}
.intake-actions{display:flex;gap:9px;margin-top:12px;}
.err{color:var(--red);font-size:12px;font-family:'IBM Plex Mono',monospace;margin-top:8px;display:none;}
.dash{display:none;}
.ticker{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;margin-bottom:18px;}
.chip{flex:0 0 auto;min-width:72px;border-radius:6px;padding:8px 10px;font-family:'IBM Plex Mono',monospace;border:1px solid var(--rule);}
.chip .q{font-size:10px;color:var(--muted);display:block;margin-bottom:4px;}
.chip .g{font-size:13px;font-weight:600;}
.chip.pos{background:rgba(79,174,131,.1);border-color:rgba(79,174,131,.35);}.chip.pos .g{color:var(--green);}
.chip.neg{background:rgba(193,80,62,.1);border-color:rgba(193,80,62,.35);}.chip.neg .g{color:var(--red);}
.chip.flat .g{color:var(--muted);}.chip.latest{box-shadow:0 0 0 1.5px var(--amber);}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
@media(max-width:760px){.kpi-row{grid-template-columns:1fr 1fr;}}
.kpi{background:var(--bg-panel);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;}
.kpi-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi-value{font-family:'Source Serif 4',serif;font-size:23px;font-weight:600;margin-bottom:6px;}
.kpi-delta{font-family:'IBM Plex Mono',monospace;font-size:11px;display:flex;gap:6px;flex-wrap:wrap;}
.kpi-delta span{padding:2px 5px;border-radius:4px;}
.up{color:var(--green);background:rgba(79,174,131,.12);}.down{color:var(--red);background:rgba(193,80,62,.12);}.neutral{color:var(--muted);background:rgba(139,144,160,.1);}
.stamp-panel{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--bg-panel);border:1px solid var(--rule);border-radius:10px;padding:15px 20px;margin-bottom:18px;}
.stamp{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;text-transform:uppercase;padding:9px 15px;border:3px solid;border-radius:7px;transform:rotate(-2deg);white-space:nowrap;text-align:center;line-height:1.3;}
.stamp span{display:block;font-size:10px;font-weight:600;letter-spacing:.06em;margin-top:3px;}
.stamp.good{color:var(--green);border-color:var(--green);background:rgba(79,174,131,.08);}
.stamp.bad{color:var(--red);border-color:var(--red);background:rgba(193,80,62,.08);}
.stamp.warn{color:var(--amber);border-color:var(--amber);background:rgba(217,164,65,.08);}
.stamp.neutral{color:var(--muted);border-color:var(--muted-2);background:rgba(139,144,160,.06);}
.stamp-text{flex:1;min-width:220px;font-size:13px;line-height:1.5;}
.panel{background:var(--bg-panel);border:1px solid var(--rule);border-radius:10px;padding:16px;margin-bottom:18px;}
.panel-title{font-family:'Source Serif 4',serif;font-size:15px;font-weight:600;margin-bottom:2px;}
.panel-sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted-2);margin-bottom:10px;}
.chart-holder{position:relative;height:250px;}.chart-holder svg{width:100%;height:100%;display:block;}
.chart-legend{display:flex;gap:14px;margin-bottom:8px;flex-wrap:wrap;}
.chart-legend span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.chart-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}
.svg-tick{font-family:'IBM Plex Mono',monospace;font-size:9px;fill:var(--muted-2);}
.svg-xlabel{font-family:'IBM Plex Mono',monospace;font-size:8.5px;fill:var(--muted);}
.svg-grid{stroke:rgba(42,47,58,.7);}.svg-zero{stroke:rgba(139,144,160,.55);stroke-dasharray:2,3;}
.svg-datalabel{font-family:'IBM Plex Mono',monospace;font-size:8px;pointer-events:none;}
.insights{background:var(--bg-panel);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin-bottom:18px;}
.insight-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
.insight-list li{display:flex;gap:10px;font-size:13px;line-height:1.5;padding-bottom:9px;border-bottom:1px solid var(--rule);}
.insight-list li:last-child{border:none;padding-bottom:0;}
.tag{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-top:2px;white-space:nowrap;}
.tag.good{background:rgba(79,174,131,.15);color:var(--green);}.tag.warn{background:rgba(217,164,65,.15);color:var(--amber);}
.tag.bad{background:rgba(193,80,62,.15);color:var(--red);}.tag.info{background:rgba(139,144,160,.15);color:var(--muted);}
.ledger{background:var(--bg-panel);border:1px solid var(--rule);border-radius:10px;padding:14px;overflow-x:auto;}
table{border-collapse:collapse;width:100%;font-family:'IBM Plex Mono',monospace;font-size:12px;white-space:nowrap;}
thead th{text-align:right;color:var(--muted);font-size:10.5px;padding:7px 9px;border-bottom:1px solid var(--rule);}
thead th:first-child{text-align:left;color:var(--paper);}
tbody td{padding:6px 9px;text-align:right;border-bottom:1px solid rgba(42,47,58,.6);}
tbody td:first-child{text-align:left;color:var(--muted);font-family:'Inter',sans-serif;font-size:12px;}
tbody tr.hi td:first-child{color:var(--paper);font-weight:600;}
td.neg{color:var(--red);}.latest-col{background:rgba(217,164,65,.06);}
.snap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px;}
.snap-card{background:var(--bg-panel);border:1px solid var(--rule);border-radius:10px;padding:15px 17px;position:relative;}
.snap-card h4{margin:0 0 8px;font-family:'Source Serif 4',serif;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:6px;}
.snap-card h4 .status{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;text-transform:uppercase;padding:2px 6px;border-radius:4px;letter-spacing:0.04em;}
.snap-card h4 .status.good{background:rgba(79,174,131,.15);color:var(--green);}
.snap-card h4 .status.bad{background:rgba(193,80,62,.15);color:var(--red);}
.snap-card h4 .status.warn{background:rgba(217,164,65,.15);color:var(--amber);}
.snap-card h4 .status.na{background:rgba(139,144,160,.15);color:var(--muted);}
.snap-card .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:3px 0;}
.snap-card .row b{color:var(--paper);font-weight:600;font-family:'IBM Plex Mono',monospace;font-size:12px;}
.snap-empty{color:var(--muted-2);font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:center;padding:30px;background:var(--bg-panel);border:1px dashed var(--rule);border-radius:10px;}
.combined-panel{background:var(--bg-panel);border:1px solid var(--rule);border-radius:10px;padding:18px 22px;margin-bottom:20px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.combined-stamp{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.04em;padding:13px 20px;border:3px solid;border-radius:7px;transform:rotate(-2.5deg);white-space:nowrap;}
.combined-stamp.good{color:var(--green);border-color:var(--green);background:rgba(79,174,131,.08);}
.combined-stamp.bad{color:var(--red);border-color:var(--red);background:rgba(193,80,62,.08);}
.combined-stamp.warn{color:var(--amber);border-color:var(--amber);background:rgba(217,164,65,.08);}
.combined-stamp.neutral{color:var(--muted);border-color:var(--muted-2);background:rgba(139,144,160,.06);}
.combined-text{flex:1;min-width:240px;font-size:13.5px;line-height:1.55;}
.combined-text .combined-headline{font-family:'Source Serif 4',serif;font-size:15px;font-weight:600;margin-bottom:7px;}
.foot-note{text-align:center;color:var(--muted-2);font-family:'IBM Plex Mono',monospace;font-size:10.5px;margin-top:18px;}
@media print{.tabs,.intake,.foot-note,.company-row,.masthead-actions{display:none!important;}.tabpanel{display:block!important;}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="masthead-title"><span class="mark">7x</span> Master Ledger — Seven-Statement Reader</div>
    <div class="masthead-actions">
      <button class="ghost" id="clearTabBtn" title="Clear only the currently active tab">🗑 Clear this tab</button>
      <button class="ghost" id="resetAllBtn" title="Clear all pasted data and start with a new company">↻ Analyze another company</button>
      <button class="ghost" id="downloadPdfBtn">⬇ PDF of current tab</button>
      <div class="pdf-status" id="pdfStatus"></div>
    </div>
  </div>
  <div class="company-row">
    <input id="companyName" placeholder="Company name (shared across all statements — used for saving)">
    <select id="savedSelect"><option value="">— Load a saved company —</option></select>
    <button class="ghost" id="deleteSavedBtn" style="display:none;">✕ Delete saved</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tabbtn active" data-tab="snapshot">Snapshot</button>
    <button class="tabbtn" data-tab="peers">Peers<span class="dot" id="dot-peers" style="display:none"></span></button>
    <button class="tabbtn" data-tab="qr">Quarterly Results<span class="dot" id="dot-qr" style="display:none"></span></button>
    <button class="tabbtn" data-tab="pnl">Profit &amp; Loss<span class="dot" id="dot-pnl" style="display:none"></span></button>
    <button class="tabbtn" data-tab="bs">Balance Sheet<span class="dot" id="dot-bs" style="display:none"></span></button>
    <button class="tabbtn" data-tab="cf">Cash Flow<span class="dot" id="dot-cf" style="display:none"></span></button>
    <button class="tabbtn" data-tab="ratios">Ratios<span class="dot" id="dot-ratios" style="display:none"></span></button>
    <button class="tabbtn" data-tab="sh">Shareholding<span class="dot" id="dot-sh" style="display:none"></span></button>
  </div>

  <div class="tabpanel active" id="panel-snapshot">
    <div id="snapContent"><div class="snap-empty">Paste data into any of the seven tabs above to build the snapshot. Cross-statement checks appear here once two or more are loaded.</div></div>
  </div>

  <div class="tabpanel" id="panel-peers">
    <div class="intake" id="intake-peers">
      <label class="field-label">Paste the "Peer Comparison" table from Screener</label>
      <textarea id="paste-peers" placeholder="S.No.&#9;Company&#9;CMP Rs.&#9;Mar Cap Rs.Cr.&#9;Debt / Eq&#9;P/E&#9;EPS 12M Rs.&#9;Sales growth %&#9;PEG&#9;ROE %&#9;Ind PE&#10;1.&#9;…"></textarea>
      <div class="intake-actions">
        <button class="primary" data-run="peers">Read the peers →</button>
        <button class="ghost" data-sample="peers">Try sample data</button>
        <input id="focusCompany" placeholder="Focus company (optional — highlights it in the charts)" style="flex:1;min-width:180px;background:#101318;color:var(--paper);border:1px solid var(--rule);border-radius:6px;font-family:'Inter',sans-serif;font-size:12.5px;padding:8px 11px;">
      </div>
      <div class="err" id="err-peers"></div>
    </div>
    <div class="dash" id="dash-peers"></div>
  </div>

  <div class="tabpanel" id="panel-qr">
    <div class="intake" id="intake-qr">
      <label class="field-label">Paste the "Quarterly Results" table from Screener</label>
      <textarea id="paste-qr" placeholder="Quarterly Results&#10;Sales +&#9;14,745&#9;16,545 …"></textarea>
      <div class="intake-actions"><button class="primary" data-run="qr">Read the results →</button><button class="ghost" data-sample="qr">Try sample data</button></div>
      <div class="err" id="err-qr"></div>
    </div>
    <div class="dash" id="dash-qr"></div>
  </div>

  <div class="tabpanel" id="panel-pnl">
    <div class="intake" id="intake-pnl">
      <label class="field-label">Paste the "Profit &amp; Loss" table from Screener</label>
      <textarea id="paste-pnl" placeholder="Profit & Loss&#10;Sales +&#9;71,448&#9;75,841 …"></textarea>
      <div class="intake-actions"><button class="primary" data-run="pnl">Read the results →</button><button class="ghost" data-sample="pnl">Try sample data</button></div>
      <div class="err" id="err-pnl"></div>
    </div>
    <div class="dash" id="dash-pnl"></div>
  </div>

  <div class="tabpanel" id="panel-bs">
    <div class="intake" id="intake-bs">
      <label class="field-label">Paste the "Balance Sheet" table from Screener</label>
      <textarea id="paste-bs" placeholder="Balance Sheet&#10;Equity Capital&#9;8,245&#9;8,245 …"></textarea>
      <div class="intake-actions"><button class="primary" data-run="bs">Read the results →</button><button class="ghost" data-sample="bs">Try sample data</button></div>
      <div class="err" id="err-bs"></div>
    </div>
    <div class="dash" id="dash-bs"></div>
  </div>

  <div class="tabpanel" id="panel-cf">
    <div class="intake" id="intake-cf">
      <label class="field-label">Paste the "Cash Flows" table from Screener</label>
      <textarea id="paste-cf" placeholder="Cash Flows&#10;Cash from Operating Activity +&#9;-0.22&#9;5.36 …"></textarea>
      <div class="intake-actions"><button class="primary" data-run="cf">Read the results →</button><button class="ghost" data-sample="cf">Try sample data</button></div>
      <div class="err" id="err-cf"></div>
    </div>
    <div class="dash" id="dash-cf"></div>
  </div>

  <div class="tabpanel" id="panel-ratios">
    <div class="intake" id="intake-ratios">
      <label class="field-label">Paste the "Ratios" table from Screener</label>
      <textarea id="paste-ratios" placeholder="Ratios&#10;Debtor Days&#9;17&#9;18 …&#10;ROCE %&#9;10%&#9;18% …"></textarea>
      <div class="intake-actions"><button class="primary" data-run="ratios">Read the ratios →</button><button class="ghost" data-sample="ratios">Try sample data</button></div>
      <div class="err" id="err-ratios"></div>
    </div>
    <div class="dash" id="dash-ratios"></div>
  </div>

  <div class="tabpanel" id="panel-sh">
    <div class="intake" id="intake-sh">
      <label class="field-label">Paste the "Shareholding Pattern" table from Screener (Quarterly view)</label>
      <textarea id="paste-sh" placeholder="Shareholding Pattern&#10;Promoters +&#9;47.22%&#9;46.89% …"></textarea>
      <div class="intake-actions"><button class="primary" data-run="sh">Read the results →</button><button class="ghost" data-sample="sh">Try sample data</button></div>
      <div class="err" id="err-sh"></div>
    </div>
    <div class="dash" id="dash-sh"></div>
  </div>

  <div class="foot-note">Not investment advice. Numbers are read exactly as pasted — verify against the source before relying on them.</div>
</div>

<script>
(function(){
// ============================== SHARED ENGINE ==============================
const PERIOD_RE = /^[A-Za-z]{3,9}[\s'’]?\d{2,4}$/;
function splitCells(l){ return l.indexOf('\t')!==-1 ? l.split('\t').map(s=>s.trim()) : l.split(/ {2,}/).map(s=>s.trim()).filter(s=>s.length); }
function parseNum(raw){
  if(raw==null) return null;
  let s=String(raw).trim();
  if(s===''||s==='-'||s==='—') return null;
  s=s.replace(/,/g,'').replace(/%/g,'').replace(/₹/g,'').replace(/\bx\b/gi,'').replace(/\bCr\.?/gi,'').trim();
  const neg=/^\(.*\)$/.test(s); s=s.replace(/[()]/g,'');
  const n=parseFloat(s); if(isNaN(n)) return null; return neg?-n:n;
}
function cleanLabel(l){ return l.replace(/[+\-]\s*$/,'').replace(/:\s*$/,'').trim(); }
function findRow(rows,pats){ for(const p of pats){ const r=rows.find(r=>p.test(r.label)); if(r) return r; } return null; }
function parseTable(text, sectionRE){
  const lines=text.split('\n').map(l=>l.replace(/\r/g,'')).filter(l=>l.trim().length);
  let headerIdx=-1, headerCells=null;
  for(let i=0;i<lines.length;i++){
    const cells=splitCells(lines[i]);
    if(cells.length>=3){
      const m=cells.filter(c=>PERIOD_RE.test(c)).length;
      if(m>=Math.max(3,Math.floor(cells.length*0.55))){ headerIdx=i; headerCells=cells; break; }
    }
  }
  if(headerIdx===-1) throw new Error('Couldn\'t find the period header row (e.g. "Mar 2023  Mar 2024 …"). Make sure the full table, including the header, is pasted.');
  const periods=headerCells.filter(c=>c.length>0);
  const rows=[]; let i=headerIdx+1;
  for(; i<lines.length; i++){
    const trimmed=lines[i].trim();
    if(sectionRE && sectionRE.test(trimmed)) break;
    const cells=splitCells(lines[i]);
    if(cells.length<2) continue;
    const label=cleanLabel(cells[0]); if(!label) continue;
    const isPct=cells.slice(1).some(c=>String(c).indexOf('%')!==-1);
    const values=periods.map((p,pi)=>parseNum(cells[pi+1]));
    rows.push({label,isPercentRow:isPct,values});
  }
  if(rows.length===0) throw new Error('Found a header row but no data rows underneath it.');
  let statBlocks=null;
  if(sectionRE){
    statBlocks={}; let cur=null;
    for(; i<lines.length; i++){
      const t=lines[i].trim();
      if(sectionRE.test(t)){ cur=t; statBlocks[cur]={}; continue; }
      if(!cur) continue;
      const cells=splitCells(lines[i]); if(cells.length<2) continue;
      const key=cleanLabel(cells[0]); if(!key) continue;
      statBlocks[cur][key]=parseNum(cells[1]);
    }
  }
  return {periods,rows,statBlocks};
}
const fmt = n => n==null||isNaN(n) ? '—' : n.toLocaleString('en-IN',{maximumFractionDigits:Math.abs(n)<10?2:0});

function armConfirm(btn, confirmLabel, restoreLabel, onConfirm){
  let armed=false, timer=null;
  btn.addEventListener('click', ()=>{
    if(btn.disabled) return;
    if(!armed){
      armed=true;
      btn.classList.add('confirm');
      btn.textContent=confirmLabel;
      clearTimeout(timer);
      timer=setTimeout(()=>{ armed=false; btn.classList.remove('confirm'); btn.textContent=restoreLabel; },3000);
      return;
    }
    armed=false; clearTimeout(timer);
    btn.classList.remove('confirm');
    btn.textContent=restoreLabel;
    onConfirm();
  });
}

const PEER_KNOWN = {'s.no.':'__sno','s.no':'__sno','company':'company','cmp rs.':'cmp','cmp':'cmp','mar cap rs.cr.':'marcap','mar cap rs.cr':'marcap','mcap rs.cr.':'marcap','mcap':'marcap','debt / eq':'debtEq','debt/eq':'debtEq','debt / equity':'debtEq','p/e':'pe','pe':'pe','eps 12m rs.':'eps12m','eps 12m':'eps12m','sales growth %':'salesGrowth','sales growth':'salesGrowth','peg':'peg','roe %':'roe','roe':'roe','ind pe':'indPe','industry pe':'indPe'};
function normaliseHeader(h){ return String(h).toLowerCase().trim().replace(/\s+/g,' '); }
function parsePeerTable(text){
  const lines=text.split('\n').map(l=>l.replace(/\r/g,'')).filter(l=>l.trim().length);
  let headerIdx=-1, headerCells=null, columnMap=null;
  for(let i=0;i<lines.length;i++){
    const cells=splitCells(lines[i]);
    if(cells.length<4) continue;
    const map=cells.map(c=>PEER_KNOWN[normaliseHeader(c)]||null);
    if(map.includes('company') && map.filter(Boolean).length>=4){ headerIdx=i; headerCells=cells; columnMap=map; break; }
  }
  if(headerIdx===-1) throw new Error('Couldn\'t find the header row. Paste the peer comparison table with "Company" plus metric names.');
  const companyColIdx=columnMap.indexOf('company');
  const hasSNo=columnMap.indexOf('__sno')!==-1;
  const companies=[]; let medianRow=null;
  for(let i=headerIdx+1;i<lines.length;i++){
    const cells=splitCells(lines[i]);
    if(cells.length<3) continue;
    const firstTwo=[cells[0]||'',cells[1]||''].join(' ').toLowerCase();
    const isMedian=firstTwo.includes('median');
    if(isMedian){
      const row={name:'Median', isMedian:true};
      columnMap.forEach((mk,ci)=>{
        if(!mk || mk==='__sno' || mk==='company') return;
        const srcIdx = hasSNo ? ci-1 : ci;
        row[mk]=parseNum(cells[srcIdx]);
      });
      medianRow=row; continue;
    }
    const nameRaw=(cells[companyColIdx]||'').trim(); if(!nameRaw) continue;
    if(/^-?\d+(\.\d+)?$/.test(nameRaw)) continue;
    const row={name:nameRaw, isMedian:false};
    columnMap.forEach((mk,ci)=>{
      if(!mk || mk==='__sno' || mk==='company') return;
      row[mk]=parseNum(cells[ci]);
    });
    companies.push(row);
  }
  if(!companies.length) throw new Error('Found the header but no company rows underneath it.');
  if(!medianRow){
    const metrics=['marcap','debtEq','pe','eps12m','salesGrowth','peg','roe','indPe','cmp'];
    const derived={name:'Median (computed)', isMedian:true};
    metrics.forEach(m=>{
      const vals=companies.map(c=>c[m]).filter(v=>v!=null).sort((a,b)=>a-b);
      if(!vals.length){ derived[m]=null; return; }
      const mid=Math.floor(vals.length/2);
      derived[m]=(vals.length%2===0)?(vals[mid-1]+vals[mid])/2:vals[mid];
    });
    medianRow=derived;
  }
  return {companies, medianRow};
}

function runPEERS(){
  const err=document.getElementById('err-peers'); err.style.display='none';
  const text=document.getElementById('paste-peers').value.trim(); if(!text) return;
  let data; try{ data=parsePeerTable(text); }catch(e){ err.textContent=e.message; err.style.display='block'; return; }
  const {companies, medianRow}=data;
  const focusName=document.getElementById('focusCompany').value.trim();
  const focus = focusName ? companies.find(c=>c.name.toLowerCase()===focusName.toLowerCase()) : null;
  const effectiveFocus = focus || companies.reduce((a,b)=>(a.marcap||0)>(b.marcap||0)?a:b, companies[0]);
  const autoFocus = !focus;
  const medPe=medianRow.pe, medRoe=medianRow.roe;
  if(effectiveFocus.pe==null || medPe==null){ err.textContent='Needs at least P/E for the focus company and the median.'; err.style.display='block'; return; }
  const peRatio=effectiveFocus.pe/medPe;
  let valBand = peRatio<=0.75?'cheap' : peRatio<=1.15?'fair' : 'expensive';
  let roeBand = effectiveFocus.roe!=null && medRoe!=null ? (effectiveFocus.roe>=medRoe*1.15?'high' : effectiveFocus.roe>=medRoe*0.85?'mid':'low') : 'mid';

function statVal(sb,section,key){ const b=sb&&sb[section]; if(!b) return null; const v=b[key]; return v===undefined?null:v; }
function statLatest(sb,section,keys){ for(const k of keys){ const v=statVal(sb,section,k); if(v!=null) return v; } return null; }

function runPNL(){
  const err=document.getElementById('err-pnl'); err.style.display='none';
  const text=document.getElementById('paste-pnl').value.trim(); if(!text) return;
  let data; try{ data=parseTable(text,SECTION_RE); }catch(e){ err.textContent=e.message; err.style.display='block'; return; }
  const {periods,rows,statBlocks}=data;
  const sales=findRow(rows,[/^sales$/i]), expenses=findRow(rows,[/^expenses$/i]), opm=findRow(rows,[/^opm/i]);
  const interest=findRow(rows,[/^interest$/i]), pbt=findRow(rows,[/^profit before tax$/i]);
  const netProfit=findRow(rows,[/^net profit$/i]);
  if(!sales){ err.textContent='Could not find a "Sales" row.'; err.style.display='block'; return; }
  const fyIdx=[]; periods.forEach((p,i)=>{ if(p.trim().toUpperCase()!=='TTM') fyIdx.push(i); });
  const last=fyIdx[fyIdx.length-1];
  const salesCAGR5=statVal(statBlocks,'Compounded Sales Growth','5 Years');
  const profitCAGR5=statVal(statBlocks,'Compounded Profit Growth','5 Years');
  const roeLast=statLatest(statBlocks,'Return on Equity',['Last Year','TTM']);
  const yoySales = fyIdx.length>=2 ? pctChange(sales.values[fyIdx[fyIdx.length-2]],sales.values[last]) : null;
  const yoyNP = (netProfit&&fyIdx.length>=2) ? pctChange(netProfit.values[fyIdx[fyIdx.length-2]],netProfit.values[last]) : null;
  const dash=document.getElementById('dash-pnl');
  dash.innerHTML=`<div class="kpi-row" id="pnl-kpi"></div><div class="stamp-panel" id="pnl-stamp"></div>
    <div class="panel"><div class="panel-title">Sales, Expenses &amp; Net Profit</div><div class="panel-sub">₹ crores per year</div><div class="chart-legend" id="pnl-leg"></div><div class="chart-holder"><svg id="pnl-chart" viewBox="0 0 640 250"></svg></div></div>
    <div class="insights"><ul class="insight-list" id="pnl-insights"></ul></div>
    <div class="ledger"><table id="pnl-ledger"></table></div>`;
  const kr=document.getElementById('pnl-kpi'); kr.innerHTML='';
  kr.appendChild(kpiCard('Sales · '+periods[last],'₹'+fmt(sales.values[last])+' cr',[deltaPct(yoySales,'YoY '),{cls:'neutral',text:'5Y CAGR '+(salesCAGR5!=null?salesCAGR5+'%':'—')}]));
  if(netProfit) kr.appendChild(kpiCard('Net Profit · '+periods[last],'₹'+fmt(netProfit.values[last])+' cr',[deltaPct(yoyNP,'YoY '),{cls:'neutral',text:'5Y CAGR '+(profitCAGR5!=null?profitCAGR5+'%':'—')}]));
  kr.appendChild(kpiCard('ROE (latest)', roeLast!=null?roeLast+'%':'—', [{cls:'neutral',text:opm&&opm.values[last]!=null?'OPM '+opm.values[last].toFixed(1)+'%':'—'}]));
  let verdict='na',stampLabel='NOT ENOUGH DATA',stampCls='neutral',reason='',stampSub='';
  if(salesCAGR5==null||profitCAGR5==null||roeLast==null){ reason="Needs Screener's Compounded Sales/Profit Growth and ROE blocks to run the quality screen — paste those sections too."; }
  else{
    const lossYears=[]; if(netProfit) netProfit.values.forEach((v,i)=>{ if(v!=null&&v<0) lossYears.push(periods[i]); });
    const growthOk=salesCAGR5>=10, leverageOk=profitCAGR5>=salesCAGR5, roeOk=roeLast>=15, consistencyOk=lossYears.length===0;
    const fails=[!growthOk,!leverageOk,!roeOk,!consistencyOk].filter(Boolean).length;
    if(fails===0){ stampLabel='HIGH-QUALITY'; stampSub='COMPOUNDER'; stampCls='good'; verdict='good'; }
    else if(fails===1 && !lossYears.length){ stampLabel='STEADY'; stampSub='COMPOUNDER'; stampCls='warn'; verdict='warn'; }
    else { stampLabel='WEAK'; stampSub='COMPOUNDER'; stampCls='bad'; verdict='bad'; }
    if(stampCls==='good') reason='Sales and profit have both compounded well over 5 years, profit growth kept pace with revenue, ROE is comfortably above a quality bar, and there is no loss year in the pasted history.';
    else if(!growthOk) reason=`5-year sales growth (${salesCAGR5}%) is below a fast-compounder threshold.`;
    else if(!leverageOk) reason=`Profit compounded slower than sales over 5 years (${profitCAGR5}% vs ${salesCAGR5}%) — margins likely under pressure.`;
    else if(!roeOk) reason=`ROE (${roeLast}%) is below a typical quality threshold.`;
    else reason=`There is at least one loss year in the pasted history (${lossYears.join(', ')}).`;
  }
  renderStamp('pnl-stamp',stampCls,stampLabel,reason,stampSub);
  renderCombo('pnl-chart','pnl-leg',periods,[{name:'Sales',color:'#D9A441',data:sales.values},expenses&&{name:'Expenses',color:'rgba(139,144,160,.55)',data:expenses.values}].filter(Boolean), netProfit&&{name:'Net Profit',color:'#4FAE83',data:netProfit.values}, v=>Math.abs(v)>=1000?(v/1000).toFixed(1)+'k':Math.round(v));
  const il=document.getElementById('pnl-insights'); il.innerHTML='';
  if(salesCAGR5!=null&&profitCAGR5!=null){ const out=profitCAGR5>salesCAGR5; addInsight(il,out?'margin expansion':'margin pressure',out?'good':'warn',`Sales compounded at ${salesCAGR5}%/yr over 5 years vs profit at ${profitCAGR5}%/yr — ${out?'profit outpaced revenue':'profit lagged revenue'}.`); }
  if(netProfit){ const lossYears=[]; netProfit.values.forEach((v,i)=>{ if(v!=null&&v<0) lossYears.push(periods[i]); });
    if(lossYears.length) addInsight(il,'loss year','bad',`Net profit was negative in ${lossYears.join(', ')}.`); else addInsight(il,'consistent','good','No loss years in the pasted history.'); }
  if(interest&&pbt){ const iv=interest.values[last],pv=pbt.values[last]; if(iv!=null&&pv!=null&&(pv+iv)>0){ const b=iv/(pv+iv)*100; if(b>20) addInsight(il,'interest load','warn',`Interest absorbs ~${b.toFixed(0)}% of pre-interest pre-tax profit in ${periods[last]}.`); } }
  if(!il.children.length) addInsight(il,'note','info','Not enough rows matched to generate deeper read-outs.');
  renderLedger('pnl-ledger',periods,rows,/^(sales|net profit|operating profit|profit before tax)$/i);
  document.getElementById('dash-pnl').style.display='block'; document.getElementById('intake-pnl').style.display='none';
  document.getElementById('dot-pnl').style.display='inline-block';
  MS.pnl={label:'Profit & Loss',verdict,items:[['Sales, latest FY','₹'+fmt(sales.values[last])+' cr'],['5Y Sales CAGR',salesCAGR5!=null?salesCAGR5+'%':'—'],['ROE',roeLast!=null?roeLast+'%':'—']], salesCAGR5, interest: interest?interest.values[last]:null, pbt: pbt?pbt.values[last]:null, netProfitLatest: netProfit?netProfit.values[last]:null};
  persist(); renderSnapshot();
}

  tw.scrollLeft=tw.scrollWidth;
  const promCur=prom.values[last], promPrev=last>=1?prom.values[last-1]:null, promChange=(promCur!=null&&promPrev!=null)?promCur-promPrev:null;
  const kr=document.getElementById('sh-kpi'); kr.innerHTML='';
  kr.appendChild(kpiCard('Promoters · '+periods[last], promCur!=null?promCur.toFixed(2)+'%':'—', [{cls:promChange==null?'neutral':(Math.abs(promChange)<0.05?'neutral':(promChange>=0?'up':'down')),text:'QoQ '+(promChange==null?'—':(promChange>=0?'+':'')+promChange.toFixed(2)+'pp')}]));
  kr.appendChild(kpiCard('FIIs+DIIs · '+periods[last], inst[last]!=null?inst[last].toFixed(2)+'%':'—', [{cls:'neutral',text:'—'}]));
  if(pub) kr.appendChild(kpiCard('Public · '+periods[last], pub.values[last]!=null?pub.values[last].toFixed(2)+'%':'—', [{cls:'neutral',text:'—'}]));
  let stampCls='neutral', stampLabel='NOT ENOUGH DATA', reason='';
  if(promChange==null){ reason='Needs at least two quarters of promoter holding data.'; }
  else if(promChange<=-2){ const instChange=(inst[last]!=null&&inst[last-1]!=null)?inst[last]-inst[last-1]:null; const absorbed=instChange!=null&&instChange>=Math.abs(promChange)*0.6;
    stampCls='bad'; stampLabel='OWNERSHIP SHIFT'; reason=`Promoter holding fell ${Math.abs(promChange).toFixed(2)}pp this quarter.`+(absorbed?` Largely absorbed by institutions (FII+DII +${instChange.toFixed(2)}pp).`:' Institutional holding didn\u2019t pick up a matching amount — check filings.'); }
  else if(promChange>=0.5){ stampCls='good'; stampLabel='STABLE OWNERSHIP'; reason=`Promoter holding rose ${promChange.toFixed(2)}pp this quarter — increased commitment.`; }
  else { stampCls='good'; stampLabel='STABLE OWNERSHIP'; reason='Promoter holding has been broadly stable — no meaningful ownership shift.'; }
  renderStamp('sh-stamp',stampCls,stampLabel,reason);
  const series=[{name:'Promoters',color:'#D9A441',data:prom.values}];
  if(fii) series.push({name:'FIIs',color:'#7FB3D5',data:fii.values});
  if(dii) series.push({name:'DIIs',color:'#4FAE83',data:dii.values});
  if(pub) series.push({name:'Public',color:'#8B90A0',data:pub.values});
  renderStacked('sh-chart','sh-leg',periods,series, v=>v.toFixed(0)+'%');
  const il=document.getElementById('sh-insights'); il.innerHTML='';
  let maxAbs=0,maxIdx=-1; for(let i=1;i<=last;i++){ if(prom.values[i]!=null&&prom.values[i-1]!=null){ const d=prom.values[i]-prom.values[i-1]; if(Math.abs(d)>Math.abs(maxAbs)){maxAbs=d;maxIdx=i;} } }
  if(maxIdx!==-1&&Math.abs(maxAbs)>=1.5) addInsight(il,'anomaly','warn',`Sharpest single-quarter promoter move: ${(maxAbs>=0?'+':'')}${maxAbs.toFixed(2)}pp in ${periods[maxIdx]} — check exchange filings.`);
  const firstIdx=prom.values.findIndex(v=>v!=null);
  if(firstIdx!==-1&&firstIdx!==last){ const change=prom.values[last]-prom.values[firstIdx]; addInsight(il,change>=0?'accumulating':'diluting',Math.abs(change)<1?'info':(change>=0?'good':'bad'),`Promoter holding moved ${(change>=0?'+':'')}${change.toFixed(2)}pp from ${periods[firstIdx]} to ${periods[last]}.`); }
  if(!il.children.length) addInsight(il,'note','info','Not enough rows matched to generate deeper read-outs.');
  renderLedger('sh-ledger',periods,rows,/^(promoters|public|no\.?\s*of\s*shareholders)$/i);
  dash.style.display='block'; document.getElementById('intake-sh').style.display='none';
  document.getElementById('dot-sh').style.display='inline-block';
  MS.sh={label:'Shareholding',verdict:stampCls==='good'?'good':stampCls==='bad'?'bad':'warn', items:[['Promoters, latest',promCur!=null?promCur.toFixed(2)+'%':'—'],['QoQ change',promChange!=null?(promChange>=0?'+':'')+promChange.toFixed(2)+'pp':'—'],['FIIs+DIIs',inst[last]!=null?inst[last].toFixed(2)+'%':'—']], promoterChangeQoQ: promChange};
  persist(); renderSnapshot();
}

const RUN={peers:runPEERS,qr:runQR,pnl:runPNL,bs:runBS,cf:runCF,ratios:runRatios,sh:runSH};
const SAMPLES={peers:SAMPLE_PEERS,qr:SAMPLE_QR,pnl:SAMPLE_PNL,bs:SAMPLE_BS,cf:SAMPLE_CF,ratios:SAMPLE_RATIOS,sh:SAMPLE_SH};
document.querySelectorAll('[data-run]').forEach(b=>b.addEventListener('click',()=>RUN[b.dataset.run]()));
document.querySelectorAll('[data-sample]').forEach(b=>b.addEventListener('click',()=>{
  document.getElementById('paste-'+b.dataset.sample).value=SAMPLES[b.dataset.sample];
  if(!document.getElementById('companyName').value) document.getElementById('companyName').value='Sample Co.';
}));

// ============================== SNAPSHOT ==============================
const ORDER=['peers','qr','pnl','bs','cf','ratios','sh'];
function statusFor(verdict){
  if(verdict==='good') return {cls:'good', label:'OK'};
  if(verdict==='bad') return {cls:'bad', label:'FLAG'};
  if(verdict==='warn') return {cls:'warn', label:'MIXED'};
  return {cls:'na', label:'—'};
}
function renderSnapshot(){
  const el=document.getElementById('snapContent');
  const keys=ORDER.filter(k=>MS[k]);
  if(!keys.length){ el.innerHTML='<div class="snap-empty">Paste data into any of the seven tabs above to build the snapshot. Cross-statement checks appear here once two or more are loaded.</div>'; return; }
  let html='<div class="snap-grid">';
  keys.forEach(k=>{ const m=MS[k]; const s=statusFor(m.verdict);
    html+=`<div class="snap-card"><h4>${esc(m.label)} <span class="status ${s.cls}">${s.label}</span></h4>`;
    m.items.forEach(([l,v])=>{ html+=`<div class="row"><span>${esc(l)}</span><b>${esc(v)}</b></div>`; });
    html+='</div>'; });
  html+='</div>';
  let goodCount=0, warnCount=0, badCount=0;
  keys.forEach(k=>{ const v=MS[k].verdict; if(v==='good') goodCount++; else if(v==='bad') badCount++; else if(v==='warn') warnCount++; });
  let combinedCls, combinedLabel, combinedText, combinedHeadline;
  if(badCount===0 && goodCount>=Math.max(3, keys.length-1)){
    combinedCls='good'; combinedLabel='STRONG';
    combinedHeadline='Fundamentally strong across the checked statements.';
  } else if(badCount>=2){
    combinedCls='bad'; combinedLabel='CAUTION';
    combinedHeadline='Multiple statements flagged — worth understanding the flags before reading anything else.';
  } else if(badCount===1){
    combinedCls='warn'; combinedLabel='MIXED';
    combinedHeadline='One statement flagged; the rest look reasonable.';
  } else {
    combinedCls='warn'; combinedLabel='MIXED';
    combinedHeadline='No outright flags, but not everything is strength either.';
  }
  combinedText = `Across ${keys.length} statements loaded: ${goodCount} reading OK, ${warnCount} mixed, ${badCount} flagged. ${combinedHeadline}`;
  html += `<div class="combined-panel"><div class="combined-stamp ${combinedCls}">${combinedLabel}</div><div class="combined-text"><div class="combined-headline">Combined Read</div>${esc(combinedText)}</div></div>`;
  const cross=[];
  if(MS.cf && MS.cf.cfoLatest!=null && MS.pnl && MS.pnl.netProfitLatest!=null && MS.pnl.netProfitLatest!==0){
    const ratio=MS.cf.cfoLatest/MS.pnl.netProfitLatest*100;
    cross.push([ratio>=70?'good':'warn', `Operating cash flow is ${ratio.toFixed(0)}% of latest reported net profit — ${ratio>=70?'profit is broadly backed by cash':'a meaningful gap between reported profit and actual cash generated, worth checking working capital'}.`]);
  }
  if(MS.bs && MS.bs.debtEquity!=null && MS.pnl && MS.pnl.interest!=null && MS.pnl.pbt!=null && (MS.pnl.pbt+MS.pnl.interest)>0){
    const burden=MS.pnl.interest/(MS.pnl.pbt+MS.pnl.interest)*100;
    cross.push([MS.bs.debtEquity<1.5&&burden<20?'good':'warn', `Debt-to-equity is ${MS.bs.debtEquity.toFixed(2)}x and interest absorbs ~${burden.toFixed(0)}% of pre-interest pre-tax profit — ${MS.bs.debtEquity<1.5&&burden<20?'leverage looks manageable':'worth watching leverage and interest coverage together'}.`]);
  }
  if(MS.sh && MS.sh.promoterChangeQoQ!=null && MS.qr && MS.qr.verdict){
    if(MS.sh.promoterChangeQoQ<=-2) cross.push(['warn', `Promoters cut their stake by ${Math.abs(MS.sh.promoterChangeQoQ).toFixed(2)}pp in the same window as the latest quarterly result — worth reading the two together.`]);
  }
  if(MS.pnl && MS.pnl.salesCAGR5!=null && MS.qr && MS.qr.salesYoY!=null){
    const gap=MS.qr.salesYoY-MS.pnl.salesCAGR5;
    if(Math.abs(gap)>=10) cross.push(['info', `Latest quarterly sales growth (${fmtPct(MS.qr.salesYoY)}) is ${gap>0?'well ahead of':'well behind'} the 5-year P&L CAGR (${MS.pnl.salesCAGR5}%) — growth is ${gap>0?'accelerating':'decelerating'} versus the long-run trend.`]);
  }
  if(MS.peers && MS.pnl){
    const val=MS.peers.valBand, quality=MS.peers.roeBand;
    if(val==='cheap' && MS.pnl.verdict==='good') cross.push(['good', `Peers show ${MS.peers.focusName||'the focus company'} trading cheaper than the peer median, and the P&amp;L screens as a quality compounder — cheap and quality at the same time, which is worth understanding.`]);
    else if(val==='expensive' && MS.pnl.verdict==='bad') cross.push(['warn', `Peers show ${MS.peers.focusName||'the focus company'} trading richer than the peer median while the P&amp;L flags as weak — an expensive stock on weak fundamentals is a red flag worth noting.`]);
    else if(val==='expensive' && MS.pnl.verdict==='good') cross.push(['info', `Peers show ${MS.peers.focusName||'the focus company'} trading richer than the peer median, and the P&amp;L screens as a quality compounder — the premium may be justified by quality.`]);
  }
  if(MS.ratios && MS.bs){
    const roceOk = MS.ratios.roceCur!=null && MS.ratios.roceCur>=15;
    const leverageOk = MS.bs.debtEquity!=null && MS.bs.debtEquity<1;
    if(roceOk && leverageOk) cross.push(['good', `ROCE above 15% with debt-to-equity below 1x is the cleanest combination — efficient operations without a levered balance sheet.`]);
    else if(!roceOk && !leverageOk) cross.push(['warn', `Both operating efficiency (ROCE ${MS.ratios.roceCur!=null?MS.ratios.roceCur.toFixed(1)+'%':'—'}) and leverage (D/E ${MS.bs.debtEquity!=null?MS.bs.debtEquity.toFixed(2)+'x':'—'}) look stretched — the two together are worth understanding.`]);
  }
  if(cross.length){
    html+='<div class="insights"><div class="panel-title" style="margin-bottom:10px;">Cross-Statement Checks</div><ul class="insight-list">'+
      cross.map(([cls,text])=>`<li><span class="tag ${cls}">${cls==='good'?'good':cls==='warn'?'warn':'info'}</span><span>${text}</span></li>`).join('')+'</ul></div>';
  }
  el.innerHTML=html;
}

// Initial button state
updateClearTabButton();
refreshSavedDropdown();
})();
</script>
